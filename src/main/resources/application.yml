server:
  port: 8080
  servlet:
    session:
      timeout: 30m          # الجلسة تنتهي بعد 30 دقيقة من عدم النشاط
      encoding:
        charset: UTF-8
        force: true
  error:
    include-message: always

spring:
  application:
    name: qanoon-erp
  profiles:
    active: dev
  mvc:
    problemdetails:
      enabled: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Dubai
        format_sql: false

qanoon:
  office-name: "مكتب المحاماة والاستشارات القانونية"
  currency: "AED"
  currency-label: "درهم"
  timezone: "Asia/Dubai"
  storage-path: "./data/uploads"
  backup-path: "./data/backups"
  appeal-days: 30                 # مدة الطعن القانونية الافتراضية
  appeal-alert-days: 7            # التنبيه قبل انتهاء الأجل
  hearing-alert-days: 3
  installment-alert-days: 3
  max-failed-logins: 5
  lock-minutes: 15
  password-min-length: 8

logging:
  level:
    root: INFO
    com.qanoon: INFO
    org.hibernate.SQL: WARN

---
# ===== وضع التطوير: قاعدة بيانات H2 داخلية، لا يحتاج SQL Server =====
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/qanoon-dev;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

---
# ===== وضع الإنتاج: SQL Server =====
spring:
  config:
    activate:
      on-profile: mssql
  datasource:
    # مصادقة ويندوز المدمجة — لا تحتاج اسم مستخدم ولا كلمة مرور ولا تغيير أي إعداد أمني في الخادم
    url: ${QANOON_DB_URL:jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=QanoonERP;encrypt=true;trustServerCertificate=true;integratedSecurity=true}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: ${QANOON_DB_USER:}
    password: ${QANOON_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.SQLServerDialect
    properties:
      hibernate:
        # كل الأعمدة النصية NVARCHAR لأن كل محتوى النظام عربي
        use_nationalized_character_data: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
